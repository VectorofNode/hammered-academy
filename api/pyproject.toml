[project]
name = "api"
version = "0.1.0"
description = ""
authors = [
    {name = "Timothy0508",email = "timothytseng508@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.129.0,<0.130.0)",
    "sqlmodel (>=0.0.37,<0.0.38)",
    "psycopg2 (>=2.9.11,<3.0.0)",
    "s3fs (>=2026.2.0,<2027.0.0)",
    "google-auth (>=2.48.0,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "minio (>=7.2.20,<8.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
]

[tool.poetry]
packages = [{include = "api", from = "src"}]


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
ruff = "^0.15.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
